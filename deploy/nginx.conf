# cloudflared connects to this loopback-only listener.
# Use your real hostname in server_name and APP_ORIGIN.
server {
 listen 127.0.0.1:8080;
 server_name tienda.example.com;
 client_max_body_size 8m;
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  # Keep TRUST_CLOUDFLARE=false until this listener can only be reached
  # by cloudflared and the origin IP header is confirmed to be sanitized.
  proxy_set_header CF-Connecting-IP "";
  proxy_read_timeout 60s;
 }
 location ~ /(?:\.env|storage|prisma|node_modules) { deny all; }
}
